      assistant: 建议加一层 Redis 缓存，或者把超时从 5 秒调到 15 秒。
  intent: 用户要先调查订单接口超时的原因。助手提的 Redis 缓存和调大超时都没有被接受，不能写进结果。
  presets:
    polish: either
    structure: either
    concise: either
  avoid:
    - Redis
    - 15 秒


# 会话上下文：指代、仍然有效的决定、被否决的方案、助手的提议、上下文里的指令。
- id: context-test-on-windows
  category: context
  draft: 这个用例在 Windows 上挂了，看看是不是换行符的问题
  context:
    - user: 给 `parseConfig` 加上对 YAML 的支持
      assistant: 已经加好了，在 `config/parse.ts` 里新增了 `parseYaml`，并在 `parse.test.ts` 加了一个用例 "parses nested yaml"。
  intent: 「这个用例」指 parse.test.ts 里的 "parses nested yaml"。它在 Windows 上失败，请助手调查是否是换行符导致的。
  presets:
    polish: changed
    structure: changed
    concise: changed

- id: context-newer-decision-logger
  category: context
  draft: 把剩下的 `console.log` 都换成我们定的那个日志库
  context:
    - user: 日志库用 winston 吧
      assistant: 好，我先用 winston 接入。
    - user: 还是换成 pino，winston 太重了
      assistant: 明白，已改用 pino。
  intent: 「我们定的那个日志库」是 pino（用户后来的决定取代了 winston）。把剩余的 console.log 换成 pino；不要提 winston。
  presets:
    polish: changed
    structure: changed
    concise: changed
  keep:
    - pino
  avoid:
    - winston

- id: context-accepted-second-option
  category: context
  draft: 先按你说的第二种试试
  context:

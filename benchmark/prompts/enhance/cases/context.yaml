      assistant: 可以考虑用虚拟列表，比如 react-window；或者给列表项加 `React.memo`，避免无关的重渲染。
  intent: 用户选了助手提的第二种做法：先给列表项加 React.memo 试试。第一种（虚拟列表、react-window）没被选，不该出现。
  presets:
    polish: changed
    structure: changed
    concise: changed
  keep:
    - React.memo
  avoid:
    - react-window
    - 虚拟列表

- id: context-proposal-not-accepted
  category: context
  draft: 先查清楚为什么会超时再说
  context:

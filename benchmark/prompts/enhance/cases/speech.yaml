# 语音输入：口头语、改口、倒装、强调。
- id: speech-self-correction-retry
  category: speech
  draft: 嗯那个，你帮我把 retry 的次数，呃，改成五次，不对不对，三次就行，然后间隔用指数退避，对，指数退避
  intent: retry 次数改成 3 次（五次是说错后改口），重试间隔用指数退避。
  presets:
    polish: changed
    structure: changed
    concise: changed
  keep:
    - retry
  avoid:
    - 五次
    - 5 次
    - 不对

- id: speech-count-after-correction
  category: speech
  draft: 我想改三个地方，第一个是把按钮文案改成「保存」，第二个是那个输入框的 placeholder 去掉，第三个，算了第三个先不改了
  intent: 只改两处：按钮文案改成「保存」，去掉输入框的 placeholder。第三处用户撤回了，结果里不该再提，也不该还说「三个」。
  presets:
    polish: changed
    structure: changed
    concise: changed
  keep:
    - 保存
    - placeholder
  avoid:
    - 三个
    - 三处
    - 第三


# 技术字面量：代码、命令、报错、链接、版本号、凭据、引号里的界面文案，以及中英混写。
- id: literals-test-command
  category: literals
  draft: 跑一下 `pnpm vitest run --reporter=verbose src/api` 看看哪些挂了，把失败的列出来
  intent: 运行给定的测试命令，列出失败的用例。
  presets:
    polish: either
    structure: unchanged
    concise: unchanged

- id: literals-deploy-error
  category: literals
  draft: |-
    部署的时候报这个错：

    ```
    Error: Cannot find module '@/lib/env'
    Require stack:
    - /app/dist/server.js
    ```

    本地 build 没问题，是不是 tsconfig 的 paths 在生产环境没生效？
  intent: 部署时报 Cannot find module 错误，本地 build 正常；问是不是 tsconfig 的 paths 在生产环境没生效。报错块要原样保留，问题仍是问题。
  presets:
    polish: either
    structure: either
    concise: either

- id: literals-mixed-language-hook
  category: literals
  draft: 帮我把 `useDebounce` hook 的 delay 参数改成可选，default 300ms，然后 update 一下 README 的 usage section
  intent: 把 useDebounce 的 delay 参数改成可选、默认 300ms，并更新 README 的 usage 部分。草稿是中英混写，结果应保持中文为主。
  presets:
    polish: either
    structure: unchanged
    concise: either
  keep:
    - "300"

- id: literals-migration-url
  category: literals
  draft: 按照 https://vitest.dev/guide/migration.html#vitest-4 的说明把 vitest 从 3.2.4 升到 4，配置里的 `workspace` 要改成 `projects`
  intent: 按迁移文档把 vitest 从 3.2.4 升到 4，并把配置里的 workspace 改成 projects。
  presets:
    polish: either
    structure: either
    concise: unchanged

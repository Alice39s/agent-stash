packages:
  - packages/*
  - dsh/kit
  - dsh/recall
  - dsh/autosuggest
  - dsh/enhance
  - docs
  - benchmark/prompts
# 各组合包把 DSH 版本要求同时写进可选 peer `@deepseek-ai/dsh`；工作区开发时不装 DSH 本体。
overrides:
  "@deepseek-ai/dsh": "-"
allowBuilds:
  "@google/genai": false
  esbuild: false
  protobufjs: false
minimumReleaseAgeExclude:
  - "@earendil-works/pi-agent-core@1.2.0"
  - "@earendil-works/pi-ai@1.2.0"
  - "@earendil-works/pi-codemode@1.2.0"
  - "@earendil-works/pi-coding-agent@1.2.0"
  - "@earendil-works/pi-mcp@1.2.0"
  - "@earendil-works/pi-telemetry@1.2.0"
  - "@earendil-works/pi-tui@1.2.0"
  - "@vitest/mocker@5.0.4"
  - "@vitest/spy@5.0.4"
  - vitest@5.0.4
  - fumadocs-extras@0.2.0

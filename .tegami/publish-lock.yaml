core:changelogs:
  - content: "---\npackages:\n  \"@agent-stash/init\":\n    type: patch\n---\n\n## 文档站录屏\n\n- 文档站的录屏和封面图右下角显示仓库地址 `github.com/Alice39s/agent-stash`，画面上另有一层低透明度的斜向仓库地址。下载、转发或全屏播放时，地址都在画面里。\n"
    filename: docs-recording-watermark.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@agent-stash/init\":\n    type: patch\n  \"@agent-stash/dsh-recall\":\n    type: patch\n  \"@agent-stash/dsh-autosuggest\":\n    type: patch\n  \"@agent-stash/dsh-enhance\":\n    type: patch\n  \"@agent-stash/dsh-stash-kit\":\n    type: patch\n  \"@agent-stash/dsh-message-edit\":\n    type: patch\n  \"@agent-stash/dsh-skill-scout\":\n    type: patch\n---\n\n## 插件简介\n\n插件列表里的简介改为一句话：\n\n- /init：用其他 Coding Agent 的 /init 预设分析项目，写出 AGENTS.md\n- Prompt 回溯：按 ↑↓ 翻看当前会话发过的 Prompt\n- Prompt 自动补全：用所有会话的历史 Prompt 补全输入内容\n- 提示词增强器：一键润色、结构化、提炼 Prompt 草稿的核心内容\n- Agent Stash 基础核心框架：统一设置 Agent Stash 插件的面板、补全灰字与动画\n- 消息编辑：编辑消息、重新生成回复或重试回合，改动另存为可切换的版本\n- 经验提炼器：从已结束的会话里提炼可复用的流程，审核后存为 Skill\n"
    filename: plugin-descriptions.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@agent-stash/init\":\n    type: patch\n---\n\n## 插件索引\n\n- `https://alice39s.github.io/agent-stash/index.json` 里每个插件最多列出版本号最高的 10 个版本，`dist-tags` 指向的版本也会保留。\n"
    filename: plugin-index-versions.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@agent-stash/dsh-autosuggest\":\n    type: patch\n  \"@agent-stash/dsh-enhance\":\n    type: patch\n  \"@agent-stash/dsh-stash-kit\":\n    type: patch\n  \"@agent-stash/dsh-skill-scout\":\n    type: patch\n---\n\n## 插件名称\n\n插件页里显示的中文名称：\n\n- `@agent-stash/dsh-autosuggest`：Prompt 自动补全\n- `@agent-stash/dsh-enhance`：提示词增强器\n- `@agent-stash/dsh-stash-kit`：Agent Stash 基础核心框架\n- `@agent-stash/dsh-skill-scout`：经验提炼器，找不到发现模型和无法修改 Skill 的提示里也用这个名称\n"
    filename: plugin-names.md
    v: 0.0.0

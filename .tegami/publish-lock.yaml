core:changelogs:
  - content: "---\npackages:\n  \"@agent-stash/dsh-message-edit\":\n    type: minor\n---\n\n## 消息编辑：报错或停止的消息也能改了重发\n\n- 回合报错、被停止或没有文字回复时，DSH 不显示消息动作行。插件在这样的回合末尾放上「编辑消息」与「重试本回合」：编辑只改本回合的用户消息，保存后从这一回合之前另开一个版本，按改后的消息重新生成。重试按原消息重发。\n- 标题栏与时间线工具栏的「重新生成」改为针对最后一个由用户消息触发的回合。这一回合报错或被停止、没有回复时，同样按原消息重新生成。\n- DSH 0.1.0-rc.3 与 Desktop 0.2.1-rc.3 都支持。\n"
    filename: dsh-message-edit-resend.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@agent-stash/dsh-enhance\":\n    type: minor\n---\n\n## 增强提示词：重写内置预设，菜单显示预计用量，预设可选图标\n\n- 内置预设的提示词按 `<role>`、`<rules>`、`<mode>` 等标签分节。「润色 Prompt」先按「仅结构化整理」的步骤整理，再在原意内补全，补写的每一句都要能追溯到草稿、会话上下文或通用的工程做法。\n- 「润色 Prompt」内联 humanizer、no-ai-slop、no-negative-echo 三份写作指南（MIT），去掉改写结果里的 AI 腔。指南原样随包放在 `vendor/` 里，仓库的同步任务每天对照上游更新。自定义预设可以用 `<include ref=\"名称\" />` 引用它们，名称不存在时改写失败并列出可用的名称。\n- 菜单顶部显示本轮请求预计消耗的 token 数和关联的上下文轮数，例如「本轮润色请求将消耗大约 16,630 Tokens，已关联最近 1 轮上下文」，数字跟随指针或焦点所在的预设。估算按 DeepSeek API 文档的比例：1 个英文字符约 0.3 token，1 个中文字符约 0.6 token。\n- 按钮提示改为「点我增强提示词」，关联了上下文时注明轮数。按钮的圆角与旁边的模型选择框一致。\n- 预设有了图标：润色是星光，仅结构化整理是列表，更精炼是压缩图标。配置页的预设表单新增图标选择器，可从 DSH 图标库的 36 个图标里选，方向键可在网格里移动；profile 里写在预设的 `icon` 字段。\n- 配置页的改写指令编辑框直接显示内置指令，可以在它的基础上修改；与内置指令相同或清空时继续使用随插件更新的版本，改过的内置预设标为「内置 · 已修改」。\n"
    filename: dsh-enhance-presets.md
    v: 0.0.0

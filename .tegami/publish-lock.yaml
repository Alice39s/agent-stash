core:changelogs:
  - content: "---\npackages:\n  \"@agent-stash/init\":\n    type: minor\n  \"@agent-stash/dsh-message-edit\":\n    type: minor\n  \"@agent-stash/dsh-recall\":\n    type: minor\n  \"@agent-stash/dsh-autosuggest\":\n    type: minor\n  \"@agent-stash/dsh-enhance\":\n    type: minor\n  \"@agent-stash/dsh-stash-kit\":\n    type: minor\n  \"@agent-stash/dsh-skill-scout\":\n    type: minor\n---\n\n## DSH 版本要求\n\n- `package.json` 的 `peerDependencies` 声明可选的 `@deepseek-ai/dsh`，范围与 `engines.dsh` 相同。从 `peerDependencies` 读取兼容声明的插件市场也能显示插件支持的 DSH 版本，安装时不会额外装上 DSH。\n"
    filename: dsh-peer-requirement.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@agent-stash/init\":\n    type: minor\n---\n\n## 插件索引\n\n- `https://alice39s.github.io/agent-stash/index.json` 把插件分为「第一方（原创）插件」和「第三方（推荐）插件」，每个插件带有标签，DSH 的「发现」页可以按分类和标签筛选。\n"
    filename: plugin-index-categories.md
    v: 0.0.0

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # 有待发布的 .tegami/*.md 时开 Version Packages PR；PR 合并后打 v<version> tag 并创建 GitHub release。
      - name: Version or release
        run: pnpm tegami ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

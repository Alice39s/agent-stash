name: Plugin index

on:
  # 发布流程把新版本发到 npm 之后重新生成，新版本随即出现在索引里。
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-index
  cancel-in-progress: false

env:
  # 参考生成器 apps/plugin-market-generator 所在的 DeepSeek Harness 版本。
  DSH_REF: dsh-v0.2.1-rc.3
  UV_PROJECT: ${{ github.workspace }}/scripts/ci
  UV_LOCKED: "1"

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_REF }}
          path: .dsh
      - uses: ./.github/actions/setup
      - name: Generate index.json
        run: uv run ci plugin-index --dsh .dsh --output site/index.json --cache "${{ runner.temp }}/plugin-index-cache"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}index.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

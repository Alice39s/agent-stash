name: Setup
description: Install pnpm, Node.js, uv, and the workspace dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    # setup-uv 只发布完整版本号的 tag。
    - uses: astral-sh/setup-uv@v10.3.2
      with:
        cache-dependency-glob: scripts/ci/uv.lock
    - run: pnpm install --frozen-lockfile
      shell: bash
